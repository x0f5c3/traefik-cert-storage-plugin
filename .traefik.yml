displayName: Certificate Storage
type: provider
iconPath: .assets/icon.png

import: github.com/x0f5c3/traefik-cert-storage-plugin
basePkg: certstorage

summary: 'Persists certificates in an embedded store, exports them to the services requesting them and signals their containers on renewal.'

testData:
  pollInterval: 10s
  storagePath: /tmp/certstorage/certstorage.json
  acmeStorage: /tmp/certstorage/acme.json
